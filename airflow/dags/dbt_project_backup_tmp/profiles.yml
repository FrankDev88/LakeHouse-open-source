lakehouse:
  outputs:
    dev:
      type: duckdb
      path: /workspace/lakehouse.duckdb
      extensions:
        - httpfs
        - aws
        - delta
      plugins:
        - module: delta
      settings:
        s3_region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
        s3_endpoint: "minio:9000"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'admin') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'password123') }}"
        s3_use_ssl: "false"
        s3_url_style: "path"
    prod:
      type: duckdb
      path: /workspace/lakehouse_prod.duckdb
      extensions:
        - httpfs
        - aws
        - delta
      plugins:
        - module: delta
      settings:
        s3_region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
        s3_endpoint: "minio:9000"
        s3_access_key_id: "{{ env_var('AWS_ACCESS_KEY_ID', 'admin') }}"
        s3_secret_access_key: "{{ env_var('AWS_SECRET_ACCESS_KEY', 'password123') }}"
        s3_use_ssl: "false"
        s3_url_style: "path"
  target: dev
