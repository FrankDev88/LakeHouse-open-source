tu_proyecto_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_PROJECT_PATH') }}/dbt_metadata.duckdb"
      threads: 1
      
      extensions:
        - ducklake
        - httpfs
        
      settings:
        s3_endpoint: "minio:9000"
        s3_access_key_id: "admin"
        s3_secret_access_key: "password123"
        s3_region: "us-east-1"
        s3_url_style: "path"
        s3_use_ssl: false

      attach:
        - path: "ducklake:{{ env_var('DBT_PROJECT_PATH') }}/raw_metadata.ducklake"
          alias: raw_lake
          options:
            data_path: "s3://retail/raw/"
        - path: "ducklake:{{ env_var('DBT_PROJECT_PATH') }}/silver_metadata.ducklake"
          alias: silver_lake
          options:
            data_path: "s3://retail/silver/"
        - path: "ducklake:{{ env_var('DBT_PROJECT_PATH') }}/gold_metadata.ducklake"
          alias: gold_lake
          options:
            data_path: "s3://retail/gold/"