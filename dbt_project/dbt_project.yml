name: 'lakehouse'
version: '1.0.0'
config-version: 2

profile: 'lakehouse'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

on-run-start:
  - "INSTALL delta; LOAD delta;"
  - "INSTALL httpfs; LOAD httpfs;"
  - "INSTALL aws; LOAD aws;"

models:
  lakehouse:
    materialized: external
    format: delta
    silver:
      materialized: external
      format: delta
    gold:
      materialized: external
      format: delta
